[project]
name = "agentsdr-shared"
version = "0.1.0"
description = "Settings, logging and cross-service types shared by api, ai-service and worker."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
