[project]
name = "agentsdr-worker"
version = "0.1.0"
description = "ARQ background worker. Runs long jobs off the request path."
requires-python = ">=3.12"
dependencies = [
    "agentsdr-shared",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    # Main-content extraction. Strips nav, footers and cookie banners — writing
    # that heuristic ourselves is the classic reinvented-library mistake.
    "trafilatura>=2.0",
]

[project.optional-dependencies]
# watchfiles backs `arq --watch`, the reload used by the compose CMD.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "watchfiles>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM", "RUF"]
