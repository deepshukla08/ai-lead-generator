[project]
name = "agentsdr-ai-service"
version = "0.1.0"
description = "LangGraph orchestration. Owns agents, prompts, tools, RAG and LLM providers."
requires-python = ">=3.12"
dependencies = [
    "agentsdr-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.50",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-postgres>=0.0.12",
    "langfuse>=2.53",
    "sentence-transformers>=3.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
